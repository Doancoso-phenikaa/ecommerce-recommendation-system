# recommendation/docker-compose.yml
# Local Kafka-in-Docker + Redis for the recommendation service.
#
# Consistency with recommendation/app/config.py:
#   - KAFKA_BOOTSTRAP default is localhost:9092  -> PLAINTEXT advertised below
#   - TOPIC default is user-events               -> created by scripts/bootstrap_topics.sh
#
# Storage note: named volumes kafka-data / redis-data persist broker + cache
# state locally (~1GB typical local footprint; NOT sized for production).
# Topic creation is owned SOLELY by scripts/bootstrap_topics.sh
# (KAFKA_AUTO_CREATE_TOPICS_ENABLE=false); do not rely on auto-create.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - rec-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - rec-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  rec-net:
    driver: bridge

volumes:
  kafka-data:
  redis-data:
