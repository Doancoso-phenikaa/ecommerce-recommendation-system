# recommendation/docker-compose.yml
# Local Kafka-in-Docker + Redis for the recommendation service.
#
# Consistency with recommendation/app/config.py:
#   - KAFKA_BOOTSTRAP default is localhost:9092  -> PLAINTEXT advertised below
#   - TOPIC default is user-events               -> created by scripts/bootstrap_topics.sh
#
# Storage note: named volumes kafka-data / redis-data persist broker + cache
# state locally (~1GB typical local footprint; NOT sized for production).
# Topic creation is owned SOLELY by scripts/bootstrap_topics.sh
# (KAFKA_AUTO_CREATE_TOPICS_ENABLE=false); do not rely on auto-create.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - rec-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - rec-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  recommendation-api:
    build:
      context: ..
      dockerfile: recommendation/Dockerfile
    container_name: recommendation-api
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: user-events
      MODEL_DIR: /app/recommendation/models
    volumes:
      - ./data:/app/recommendation/data
      - ./models:/app/recommendation/models
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rec-net

  recommendation-consumer:
    build:
      context: ..
      dockerfile: recommendation/Dockerfile
    container_name: recommendation-consumer
    command: ["python", "recommendation/scripts/consume.py"]
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: user-events
      MODEL_DIR: /app/recommendation/models
    volumes:
      - ./data:/app/recommendation/data
      - ./models:/app/recommendation/models
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rec-net

networks:
  rec-net:
    driver: bridge

volumes:
  kafka-data:
  redis-data:

