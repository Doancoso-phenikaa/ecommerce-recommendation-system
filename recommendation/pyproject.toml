[project]
name = "recommendation"
version = "0.1.0"
description = "E-commerce recommendation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "implicit",
  "scikit-learn",
  "pandas",
  "pyarrow",
  "redis",
  "kafka-python-ng==2.2.2",
  "mlflow",
  "pytest",
  "httpx",
  "prometheus-client",
]

[tool.pytest.ini_options]
markers = ["integration"]
